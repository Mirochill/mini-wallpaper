<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mini Wallpaper</title>
  <desc id="desc">A dark gradient banner describing Mini Wallpaper as an ultra-light animated wallpaper app for Windows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="770" y1="72" x2="1110" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="136" y1="98" x2="547" y2="319" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="193" cy="96" r="120" fill="#0EA5E9" fill-opacity="0.28" filter="url(#blur)"/>
  <circle cx="550" cy="356" r="155" fill="#A78BFA" fill-opacity="0.2" filter="url(#blur)"/>
  <circle cx="1048" cy="58" r="140" fill="#FB7185" fill-opacity="0.16" filter="url(#blur)"/>

  <text x="72" y="112" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1.5">
    WINDOWS • NATIVE • LOCAL-FIRST
  </text>
  <text x="72" y="188" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">
    Mini Wallpaper
  </text>
  <rect x="72" y="210" width="420" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="264" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="28">
    Ultra-light animated wallpapers
  </text>
  <text x="72" y="304" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="21">
    GIF → MP4 optimization • native WPF • no browser runtime
  </text>

  <rect x="736" y="60" width="392" height="300" rx="28" fill="url(#panel)" stroke="#334155"/>
  <rect x="766" y="90" width="332" height="150" rx="18" fill="#0F172A" stroke="#475569"/>
  <path d="M786 209L849 148L897 187L955 119L1078 217" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="955" cy="119" r="8" fill="#F8FAFC"/>
  <rect x="766" y="264" width="102" height="58" rx="14" fill="#0F172A" stroke="#334155"/>
  <rect x="881" y="264" width="102" height="58" rx="14" fill="#0F172A" stroke="#334155"/>
  <rect x="996" y="264" width="102" height="58" rx="14" fill="#0F172A" stroke="#334155"/>
  <text x="789" y="287" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">media</text>
  <text x="789" y="309" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">1080p30</text>
  <text x="905" y="287" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">runtime</text>
  <text x="905" y="309" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">native</text>
  <text x="1019" y="287" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">focus</text>
  <text x="1019" y="309" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">lean</text>
</svg>
